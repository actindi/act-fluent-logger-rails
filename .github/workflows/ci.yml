name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', head]
        gemfile: [rails_5_0, rails_5_1, rails_5_2, rails_6_0, rails_6_1, rails_7_0, rails_7_1, rails_7_2, rails_8_0, rails_8_1]
        exclude:
          - ruby: '2.4'
            gemfile: rails_6_0
          - ruby: '2.4'
            gemfile: rails_6_1
          - ruby: '2.4'
            gemfile: rails_7_0
          - ruby: '2.5'
            gemfile: rails_7_0
          - ruby: '2.6'
            gemfile: rails_7_0
          - ruby: '2.4'
            gemfile: rails_7_1
          - ruby: '2.5'
            gemfile: rails_7_1
          - ruby: '2.6'
            gemfile: rails_7_1
          - ruby: '2.4'
            gemfile: rails_7_2
          - ruby: '2.5'
            gemfile: rails_7_2
          - ruby: '2.6'
            gemfile: rails_7_2
          - ruby: '2.7'
            gemfile: rails_7_2
          - ruby: '3.0'
            gemfile: rails_7_2
          - ruby: '2.4'
            gemfile: rails_8_0
          - ruby: '2.5'
            gemfile: rails_8_0
          - ruby: '2.6'
            gemfile: rails_8_0
          - ruby: '2.7'
            gemfile: rails_8_0
          - ruby: '3.0'
            gemfile: rails_8_0
          - ruby: '3.1'
            gemfile: rails_8_0
          - ruby: '2.4'
            gemfile: rails_8_1
          - ruby: '2.5'
            gemfile: rails_8_1
          - ruby: '2.6'
            gemfile: rails_8_1
          - ruby: '2.7'
            gemfile: rails_8_1
          - ruby: '3.0'
            gemfile: rails_8_1
          - ruby: '3.1'
            gemfile: rails_8_1
          # ActiveSupport <= 7.0 requires mutex_m, which is no longer a default gem in Ruby 3.4
          - ruby: '3.4'
            gemfile: rails_5_0
          - ruby: head
            gemfile: rails_5_0
          - ruby: '3.4'
            gemfile: rails_5_1
          - ruby: head
            gemfile: rails_5_1
          - ruby: '3.4'
            gemfile: rails_5_2
          - ruby: head
            gemfile: rails_5_2
          - ruby: '3.4'
            gemfile: rails_6_0
          - ruby: head
            gemfile: rails_6_0
          - ruby: '3.4'
            gemfile: rails_6_1
          - ruby: head
            gemfile: rails_6_1
          - ruby: '3.4'
            gemfile: rails_7_0
          - ruby: head
            gemfile: rails_7_0
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Test
      run: |
        bundle exec rake spec
